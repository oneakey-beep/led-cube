<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED-Würfel 3×3 m</title>
<style>
:root{--bg:#05060a;--fg:#e8eaf0;--mut:#8a90a0;--pan:rgba(20,22,30,.78);--bd:rgba(255,255,255,.14);--ac:#7fe0a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;margin:0 auto;pointer-events:auto}
.col{display:flex;flex-direction:column;gap:14px}
button{background:rgba(255,255,255,.04);color:var(--fg);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 0;font:inherit;font-size:12px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .3s,color .3s,background .3s}
#strings{pointer-events:auto;display:block;margin:16px auto 0;padding:5px 16px;font-size:10px}
button.on{border-color:var(--ac);color:var(--ac);background:rgba(127,224,160,.08)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.3)}
input[type=range]::-moz-range-track{height:1px;background:rgba(255,255,255,.3)}
input[type=range].hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#e03030,#2fbf60 50%,#3070f0)}
input[type=range].hue::-moz-range-track{background:linear-gradient(90deg,#e03030,#2fbf60 50%,#3070f0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:6px;margin-top:-2.5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 6px rgba(255,255,255,.9)}
input[type=range]::-moz-range-thumb{width:6px;height:6px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 6px rgba(255,255,255,.9)}
#info{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;color:var(--mut);font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="info"></div>
<div id="ui"><div class="cols">
  <div class="col"><button data-m="1">Wellen</button><input type="range" class="hue" id="s1" min="0" max="1" step=".001" value=".5"></div>
  <div class="col"><button data-m="2">Regen</button><input type="range" id="s2" min="0" max="1" step=".001" value="1"></div>
  <div class="col"><button data-m="3">Tropfen</button><input type="range" id="s3" min="0" max="1" step=".001" value=".5"></div>
</div><button id="strings" class="on">Strings</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const S=3,LEDS=48,N=21;let lines;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060a);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(4.6,2.4,5.4);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.target.set(0,1.4,0);ctl.enableDamping=true;ctl.autoRotate=false;

const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(S,S,S)),new THREE.LineBasicMaterial({color:0x4a5468}));
box.position.y=S/2;scene.add(box);
scene.add(new THREE.GridHelper(8,16,0x20242e,0x14171e));

const vs=`
uniform float uTime,uSize,uScale,uSign,uArea;uniform vec4 uW;varying vec3 vCol;
vec3 col(float k){
 vec3 g=mix(vec3(0.,.5,.2),vec3(.65,1.,.55),k);
 vec3 r=mix(vec3(.6,.02,.03),vec3(1.,.45,.35),k);
 vec3 b=mix(vec3(.05,.2,.9),vec3(.5,.85,1.),k);
 return uSign<0.?mix(g,r,-uSign):mix(g,b,uSign);}
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float surf(vec2 q,float t){q+=.35*vec2(sin(q.y*1.7+t*.6),cos(q.x*1.5-t*.5));return .5*sin(q.x*.9+t*.35)+.55*sin(q.x*1.6+t*.8)+.4*sin(q.y*2.1-t*.65+q.x*.7)+.3*sin((q.x+q.y)*2.7+t*1.1)+.2*sin(q.x*4.1-q.y*3.3-t*1.5);}
void main(){
 vec3 p=position;float t=uTime;float id=h(p.xz*7.3);float vs=0.;vec3 cs=vec3(0.);
 {float lid=h(p.xz*7.3+p.y*17.3);float ph=h(p.zx*3.1+p.y*9.7);
  float v=pow(.5+.5*sin(t*(.6+ph*.5)+ph*60.),6.)*step(.92,lid)*uW.x;vs+=v;cs+=col(ph)*v;}
 {float lvl=1.7+.3*surf(p.xz,t*1.5)+.12*sin(p.x*1.2+p.z*.8-t*1.4)-(1.-uW.y)*2.4;float d=lvl-p.y;
  float glow=exp(-abs(d)*14.);float flow=.28+.22*sin(p.y*4.-t*.5+surf(p.zx*1.3,t*1.2)*2.);
  float body=smoothstep(-.03,.06,d)*flow*exp(-max(d,0.)*.4);
  float v=max(glow*1.1,body)*(1.-smoothstep(2.4,2.45,p.y))*smoothstep(0.,.15,uW.y);vs+=v;cs+=col(exp(-max(d,0.)*3.))*v;}
 {float hd=1.-fract(t*(.12+.2*id)+id);float d=p.y/3.-hd;if(d<0.)d+=1.;float v=exp(-d*9.)*uW.z;vs+=v;cs+=col(id)*v;}
 {vec3 q=p-vec3(0.,1.5,0.);float d=length(q);vec3 n=q/max(d,.001);
  float rs=(.8+.1*sin(t*1.3)+.14*sin(n.x*3.+t*1.1)*sin(n.y*3.-t*.9)+.12*sin(n.z*4.+n.x*2.-t*1.4)+.1*sin(n.y*5.+n.z*2.+t*1.7))*uW.w;
  float body=smoothstep(rs,rs-.1,d)*(.5+.35*sin(d*9.-t*2.2+n.x*3.+n.z*2.));float rim=exp(-abs(d-rs)*20.);
  float v=(body+rim*.9)*smoothstep(0.,.2,uW.w);float k=mix(.5+.5*sin(d*6.-t*1.5+n.x*3.),1.,rim*.7);vs+=v;cs+=col(k)*v;}
 vec3 c=mix(col(.3),cs/max(vs,.0001),smoothstep(0.,.02,vs));
 float R=mix(.07,2.2,uArea);float mask=1.-smoothstep(R-.06,R,length(p.xz));
 float v=.04+vs*mask;vCol=c*v;
 vec4 mv=modelViewMatrix*vec4(p,1.);
 gl_PointSize=uSize*uScale/-mv.z*(.5+.9*min(v,1.));
 gl_Position=projectionMatrix*mv;}`;
const fs=`varying vec3 vCol;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.0,d);a*=a;gl_FragColor=vec4(vCol*a*1.7,a);}`;
const mat=new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uTime:{value:0},uSize:{value:.06},uScale:{value:600},uSign:{value:0},uArea:{value:1},uW:{value:new THREE.Vector4(1,0,0,0)}}});

(function build(){
  const step=S/N,pos=[],ln=[];
  for(let i=0;i<N;i++)for(let k=0;k<N;k++){
    const x=(i+.5)*step-S/2,z=(k+.5)*step-S/2;
    ln.push(x,S,z,x,0,z);
    for(let j=0;j<LEDS;j++)pos.push(x,S-j*S/LEDS,z);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const pts=new THREE.Points(g,mat);pts.frustumCulled=false;scene.add(pts);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(ln,3));
  lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x2a3040,transparent:true,opacity:.5}));scene.add(lines);
  document.getElementById('info').textContent=`${N*N} Strings · ${N*N*LEDS} LEDs · Würfel ${S}×${S}×${S} m`;
})();

// Zustand: 0 = Idle (Funkeln), 1 = Wellen, 2 = Regen, 3 = Tropfen
let mode=0,last=performance.now(),speed=1,T=0;const W=[1,0,0,0];
const btns=[...document.querySelectorAll('button[data-m]')];
const touch=()=>{last=performance.now();};
btns.forEach(b=>b.onclick=()=>{mode=+b.dataset.m;touch();btns.forEach(x=>x.classList.toggle('on',x===b));});
const $=id=>document.getElementById(id);
$('strings').onclick=e=>{lines.visible=!lines.visible;e.target.classList.toggle('on',lines.visible);touch();};
$('s1').oninput=e=>{let s=(+e.target.value-.5)*2;if(Math.abs(s)<.06)s=0;mat.uniforms.uSign.value=s;touch();};
$('s2').oninput=e=>{mat.uniforms.uArea.value=+e.target.value;touch();};
$('s3').oninput=e=>{speed=Math.pow(4,(+e.target.value-.5)*2);touch();};

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
  mat.uniforms.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(cam.fov*Math.PI/360));}
addEventListener('resize',resize);resize();
let prev=performance.now();
(function loop(now){requestAnimationFrame(loop);
  const dt=Math.min((now-prev)/1000,.1);prev=now;
  if(mode!==0&&now-last>10000){mode=0;btns.forEach(x=>x.classList.remove('on'));}
  const k=1-Math.exp(-dt*1.2);
  for(let i=0;i<4;i++)W[i]+=((i===mode?1:0)-W[i])*k;
  mat.uniforms.uW.value.set(W[0],W[1],W[2],W[3]);
  T+=dt*speed;mat.uniforms.uTime.value=T;
  ctl.update();renderer.render(scene,cam);})(performance.now());
</script>
</body>
</html>
